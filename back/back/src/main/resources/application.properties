spring.config.import=optional:file:./secret.properties
spring.application.name=back
spring.datasource.url=jdbc:postgresql://localhost:5432/tpps
spring.datasource.username=tomas
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
app.jwt.issuer=tpps
app.jwt.accessTokenTtlMinutes=60
app.jwt.secret=${JWT_SECRET}
server.port=8080
vincario.base-url=https://api.vincario.com
vincario.api-key=${VINCARIO_API_KEY}
vincario.secret-key=${VINCARIO_SECRET_KEY}
vincario.format=json
ai.gemini.api-key=${AI_GEMINI_API_KEY}
ai.gemini.model=gemini-2.5-flash-lite
ai.gemini.base-url=https://generativelanguage.googleapis.com